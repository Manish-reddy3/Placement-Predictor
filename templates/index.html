<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 22px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            background: #f1f3ff;
            color: #333;
            font-size: 19px;
            font-weight: bold;
        }

        .note {
            margin-top: 18px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Placement Predictor</h1>
        <p class="subtitle">Enter student details to predict placement</p>

        <form action="/predict" method="POST">

            <div class="form-group">
                <label for="iq">IQ</label>
                <input
                    type="number"
                    id="iq"
                    name="iq"
                    step="any"
                    min="0"
                    required
                    placeholder="e.g. 115"
                >
            </div>

            <div class="form-group">
                <label for="cgpa">CGPA</label>
                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                    placeholder="e.g. 7.80"
                >
            </div>

            <div class="form-group">
                <label for="marks_10th">10th Marks (%)</label>
                <input
                    type="number"
                    id="marks_10th"
                    name="marks_10th"
                    step="0.01"
                    min="0"
                    max="100"
                    required
                    placeholder="e.g. 75.60"
                >
            </div>

            <div class="form-group">
                <label for="marks_12th">12th Marks (%)</label>
                <input
                    type="number"
                    id="marks_12th"
                    name="marks_12th"
                    step="0.01"
                    min="0"
                    max="100"
                    required
                    placeholder="e.g. 65.00"
                >
            </div>

            <div class="form-group">
                <label for="btech_cgpa">BTech CGPA</label>
                <input
                    type="number"
                    id="btech_cgpa"
                    name="btech_cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                    placeholder="e.g. 6.28"
                >
            </div>

            <button type="submit">Predict Placement</button>
        </form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}

        <p class="note">
            ML prediction based on the trained classification model.
        </p>
    </div>
</body>
</html>
